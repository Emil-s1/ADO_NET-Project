<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CollegeDB — данные колледжа</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, Arial, sans-serif; }
    body { margin: 0; background: #0d1117; color: #edf2f7; }
    header { padding: 30px 20px; text-align: center; background: linear-gradient(120deg,#105b56,#117d72); }
    h1 { margin: 0; font-size: clamp(2rem,5vw,3.4rem); }
    header p { margin: 8px 0 0; }
    main { max-width: 1050px; margin: 32px auto; padding: 0 18px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
    button { border: 0; border-radius: 6px; padding: 11px 16px; color: white; background: #1769aa; cursor: pointer; font-weight: 700; }
    button:hover { filter: brightness(1.15); }
    button.active { background: #16836f; }
    #status { color: #b9c5d2; margin: 12px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 14px; }
    .card { background: #151c25; border: 1px solid #34404d; border-radius: 9px; padding: 17px; }
    .card h3 { margin: 0 0 8px; color: #6ee7d0; }
    .muted { color: #a9b4c0; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #111820; padding: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>CollegeDB</h1>
    <p>ASP.NET Core · MapGet() · Dapper</p>
  </header>
  <main>
    <div class="toolbar">
      <button class="active" data-endpoint="/api/students">Студенты</button>
      <button data-endpoint="/api/groups">Группы</button>
    </div>
    <h2 id="heading">Студенты</h2>
    <p id="status">Загрузка данных…</p>
    <section id="results" class="grid"></section>
    <h3>JSON-ответ API</h3>
    <pre id="raw">Ожидание ответа…</pre>
  </main>
  <script>
    const buttons = document.querySelectorAll('button[data-endpoint]');
    const heading = document.querySelector('#heading');
    const status = document.querySelector('#status');
    const results = document.querySelector('#results');
    const raw = document.querySelector('#raw');

    function addField(card, label, value) {
      const p = document.createElement('p');
      const strong = document.createElement('strong');
      strong.textContent = label + ': ';
      p.append(strong, document.createTextNode(value ?? '—'));
      card.appendChild(p);
    }

    function render(items, endpoint) {
      results.replaceChildren();
      const isStudents = endpoint.includes('students');
      if (!Array.isArray(items) || items.length === 0) {
        status.textContent = 'Данные не найдены.';
        return;
      }
      status.textContent = `Записей: ${items.length}`;
      for (const item of items) {
        const card = document.createElement('article');
        card.className = 'card';
        const title = document.createElement('h3');
        title.textContent = isStudents
          ? `${item.firstName ?? ''} ${item.lastName ?? ''}`.trim() || `Студент #${item.studentId}`
          : (item.groupName ?? `Группа #${item.groupId}`);
        card.appendChild(title);
        if (isStudents) {
          addField(card, 'ID', item.studentId);
          addField(card, 'Группа ID', item.groupId);
        } else {
          addField(card, 'ID', item.groupId);
        }
        results.appendChild(card);
      }
    }

    async function load(endpoint) {
      heading.textContent = endpoint.includes('students') ? 'Студенты' : 'Группы';
      status.textContent = 'Загрузка данных…';
      results.replaceChildren();
      raw.textContent = '';
      buttons.forEach(button => button.classList.toggle('active', button.dataset.endpoint === endpoint));
      try {
        const response = await fetch(endpoint);
        const body = await response.text();
        raw.textContent = body;
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${body}`);
        render(JSON.parse(body), endpoint);
      } catch (error) {
        status.textContent = 'Не удалось загрузить данные. Проверьте подключение к базе и структуру таблиц.';
        const p = document.createElement('p');
        p.className = 'muted';
        p.textContent = String(error);
        results.appendChild(p);
      }
    }

    buttons.forEach(button => button.addEventListener('click', () => load(button.dataset.endpoint)));
    load('/api/students');
  </script>
</body>
</html>
