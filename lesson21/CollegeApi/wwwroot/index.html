<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CollegeDB — студенты и группы</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font:16px Arial,sans-serif}
    main{max-width:1000px;margin:40px auto;padding:24px;background:#fff;border-radius:14px;box-shadow:0 8px 30px #18233a12}
    h1,h2{margin-top:0}form{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
    input,select,button{padding:11px;border:1px solid #cbd3df;border-radius:8px;font:inherit}
    input,select{flex:1;min-width:150px}button{background:#087f8c;color:white;border:0;cursor:pointer}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e3e8ef}
    .message{min-height:22px;color:#b42318}.sections{display:grid;grid-template-columns:1fr 1fr;gap:26px}
    @media(max-width:700px){main{margin:12px;padding:16px}.sections{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>CollegeDB — студенты и группы</h1>
  <div class="sections">
    <section>
      <h2>Добавить студента</h2>
      <form id="student-form">
        <input id="firstName" placeholder="Имя" required>
        <input id="lastName" placeholder="Фамилия" required>
        <select id="groupId"><option value="">Без группы</option></select>
        <button type="submit">Добавить</button>
      </form>
    </section>
    <section>
      <h2>Добавить группу</h2>
      <form id="group-form">
        <input id="groupName" placeholder="Название группы" required>
        <button type="submit">Добавить</button>
      </form>
      <ul id="groups"></ul>
    </section>
  </div>
  <div id="message" class="message"></div>
  <h2>Все студенты</h2>
  <table>
    <thead><tr><th>ID</th><th>Имя</th><th>Фамилия</th><th>ID группы</th></tr></thead>
    <tbody id="students"></tbody>
  </table>
</main>
<script src="routes.js"></script>
</body>
</html>
